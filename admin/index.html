<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#021220">
<title>Mirage Access</title>
<link rel="icon" href="../assets/mirage-m.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=Cinzel:wght@400;600&family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021220;--side:#02101c;--panel:#06233a;--panel2:#082d49;--field:#010d18;
  --line:rgba(105,229,255,.14);--line2:rgba(105,229,255,.28);
  --text:#eafaff;--muted:#8daebe;--dim:#5f8396;
  --cyan:#65eaff;--blue:#0b70a6;--sand:#ffcf8a;--ok:#55e88a;--warn:#f1c76c;--bad:#ff7b7b;
  --display:"Bricolage Grotesque",Inter,Arial,sans-serif;
  --pv:0px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font:14px/1.5 Inter,Arial,sans-serif;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--cyan)}
[hidden]{display:none!important}
::selection{background:rgba(101,234,255,.3)}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* ================= login ================= */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 40% at 50% 100%,rgba(255,196,120,.14),transparent 70%),linear-gradient(180deg,#041a2b,#0a2b46 60%,#154a73)}
.login .card{width:min(440px,100%);background:rgba(2,18,32,.82);border:1px solid var(--line);border-radius:16px;padding:34px;backdrop-filter:blur(8px)}
.login h1{margin:0 0 22px;font:800 32px/1 var(--display);letter-spacing:-1.2px}
.login h1 span{color:var(--cyan)}
.err{color:var(--bad);font-size:13px;margin:12px 0 0;min-height:18px}

/* ================= shell ================= */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) var(--pv);min-height:100vh;transition:grid-template-columns .25s}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font:800 19px var(--display);letter-spacing:-.4px}
.brand img{width:28px;height:28px}
.grp{font-size:11px;font-weight:600;color:var(--dim);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--muted);font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.on{color:var(--cyan);background:rgba(101,234,255,.09);border-color:var(--line)}
.nav .n{margin-left:auto;font-size:11px;font-weight:600;color:var(--dim)}
.nav.on .n{color:var(--cyan)}
.side-foot{margin-top:auto;padding-top:16px}

.main{min-width:0;background:linear-gradient(180deg,#041a2c,#031523 420px)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 32px;background:rgba(2,16,28,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{flex-wrap:wrap}
.top h1{white-space:nowrap;margin:0 auto 0 0;font:800 22px var(--display);letter-spacing:-.6px}
.pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.dirty{color:var(--warn);border-color:rgba(241,199,108,.45)}
.pill.clean{color:var(--ok);border-color:rgba(85,232,138,.35)}
.btn{white-space:nowrap;border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--text)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:rgba(101,234,255,.1);border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:#0d84c2}
.btn.danger{color:var(--bad);border-color:rgba(255,123,123,.35)}
.btn.danger:hover{background:rgba(255,123,123,.1);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(101,234,255,.1)}
.wrap{padding:28px 32px 90px;max-width:1040px}

/* ================= cards & fields ================= */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}
.card>h2{margin:0 0 4px;font:800 19px var(--display);letter-spacing:-.4px}
.card h3{margin:24px 0 10px;font-size:13px;font-weight:700;color:var(--cyan)}
.hint{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 18px;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:12px;font-weight:600;color:#b9d3df;margin-bottom:6px}
input[type=text],input[type=password],input[type=url],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(101,234,255,.13)}
textarea{min-height:92px;resize:vertical;line-height:1.6}
select option{background:#06223a}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}

/* switch */
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;width:40px;height:23px;border-radius:99px;background:#0c3250;border:1px solid var(--line2);flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#7fa2b3;transition:.2s}
.sw input:checked+i{background:rgba(85,232,138,.25);border-color:var(--ok)}
.sw input:checked+i:after{left:19px;background:var(--ok)}
.sw input:focus-visible+i{outline:2px solid var(--sand);outline-offset:2px}
.sw small{font-weight:400;color:var(--muted)}

/* lists */
.item{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;background:rgba(1,13,24,.4)}
.item-head{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.item-head b{margin-right:auto;font-size:13px}
.ibtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;text-decoration:none;font-size:13px}
.ibtn:hover{color:var(--cyan);border-color:var(--cyan)}
.ibtn.x:hover{color:var(--bad);border-color:var(--bad)}
.addbar{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--cyan);transform:translateY(-2px)}
.stat b{display:block;font:800 34px/1 var(--display);letter-spacing:-1px;margin-bottom:6px}
.stat span{color:var(--muted);font-size:13px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.dash .card{margin:0}
.line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line>span:first-child{margin-right:auto;font-weight:600}
.line select{width:auto;padding:6px 10px;font-size:13px}
.act{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.act:last-child{border-bottom:0}
.act div{min-width:0;margin-right:auto}
.act b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act small{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(85,232,138,.15);color:var(--ok);flex:none}

/* videos */
.vadd{display:flex;gap:10px}
.vadd textarea{min-height:46px;height:46px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.vc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(1,13,24,.5);display:flex;flex-direction:column;cursor:grab;transition:border-color .15s}
.vc.drag{opacity:.3}
.vc.over{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(101,234,255,.25)}
.vc.broken{border-color:var(--bad)}
.vth{position:relative;aspect-ratio:16/9;background:#021220}
.vth img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vpos{position:absolute;top:8px;left:8px;background:rgba(2,18,34,.88);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.vbad{position:absolute;right:8px;bottom:8px;background:var(--bad);color:#2a0000;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700}
.vbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.vbody input{padding:7px 9px;font-size:12px}
.vact{display:flex;gap:6px}
.vact .ibtn{flex:1;height:28px;width:auto}
.vid{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}

/* media */
.drop{border:2px dashed var(--line2);border-radius:14px;padding:30px;text-align:center;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--cyan);background:rgba(101,234,255,.07);color:var(--text)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.mc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(1,13,24,.5)}
.mc .im{aspect-ratio:1;display:grid;place-items:center;background:repeating-conic-gradient(#0a2236 0 25%,#071a2b 0 50%) 0 0/16px 16px}
.mc img{max-width:100%;max-height:100%;object-fit:contain}
.mc div.cap{padding:8px 10px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .vact{padding:0 8px 8px}
.thumb{width:44px;height:44px;border-radius:8px;background:#0a2236;object-fit:cover;flex:none}

/* history */
.ver{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.ver:last-child{border-bottom:0}
.ver div{min-width:0;margin-right:auto}
.ver b{display:block;font-size:13px}
.ver small{color:var(--muted)}

/* preview drawer */
.pv{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pvbar{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pvbar select{width:auto;padding:6px 10px;font-size:12px}
.pvbar .sp{margin-right:auto}
.pvbody{flex:1;display:grid;place-items:start center;overflow:auto;padding:14px;background:#010a13}
.pvbody iframe{border:1px solid var(--line);border-radius:10px;background:#031523;width:100%;height:100%;min-height:520px}
.pvbody.phone iframe{width:390px;max-width:100%}
.pvnote{font-size:11px;color:var(--dim);padding:8px 14px;border-top:1px solid var(--line)}

/* application builder */
input[type=date],input[type=color]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;color-scheme:dark}
input[type=color]{padding:3px;height:42px;cursor:pointer}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(1,13,24,.5);margin-bottom:18px;flex-wrap:wrap}
.segb{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;color:var(--muted);cursor:pointer}
.segb.on{background:rgba(101,234,255,.12);color:var(--cyan)}
.appgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.rolelist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:auto 1fr;column-gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.rcard:hover{border-color:var(--line2)}
.rcard.on{border-color:var(--cyan);background:var(--panel2)}
.rcard .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--ok)}
.rcard .dot.bad{background:var(--bad)}
.rcard .rn{font-weight:700}
.rcard small{grid-column:2;color:var(--muted)}
.note{border:1px solid rgba(255,123,123,.45);background:rgba(255,123,123,.08);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.note ul{margin:6px 0 0;padding-left:18px;color:#ffd0d0}
.note.warn{border-color:rgba(241,199,108,.45);background:rgba(241,199,108,.07)}
.meter{height:8px;border-radius:99px;background:#0a2236;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px}
.meter i.bad{background:var(--bad)}
.q{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:rgba(1,13,24,.4);overflow:hidden}
.q.open{border-color:var(--line2)}
.qhead{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.qhead:hover{background:rgba(255,255,255,.03)}
.qtype{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(101,234,255,.1);color:var(--cyan);flex:none}
.qtitle{font-size:13.5px;font-weight:600;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qreq{font-size:11px;color:var(--sand);flex:none}
.qbtns{display:flex;gap:4px;flex:none}
.qbtns .ibtn{width:28px;height:28px}
.qbody{padding:6px 16px 16px;border-top:1px solid var(--line)}
.qbody>.f:first-child,.qbody>label.f:first-child{margin-top:14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#06304f;border:1px solid var(--cyan);border-radius:10px;padding:12px 18px;font-weight:600;z-index:200;transition:.25s;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad);background:#3a1010}

@media(max-width:1180px){
  .pv{position:fixed;inset:0 0 0 auto;width:min(560px,100vw);z-index:60;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  .app{grid-template-columns:248px minmax(0,1fr)!important}
}
@media(max-width:900px){
  .appgrid{grid-template-columns:1fr}
  .app{grid-template-columns:1fr!important}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);gap:6px}
  .brand,.grp,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .top{padding:12px 16px;flex-wrap:wrap}
  .wrap{padding:20px 16px 90px}
  .stats{grid-template-columns:1fr 1fr}
  .dash,.grid2{grid-template-columns:1fr}
}

/* ===== Alerts + Design studio ===== */
input[type=datetime-local]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color-scheme:dark}
.bnp{margin-bottom:16px;padding:10px 14px;border-radius:9px;text-align:center;font-weight:600;font-size:13px}.bnp.off{opacity:.4}
.lv-info{background:#0b70a6;color:#effcff}.lv-success{background:#127a4a;color:#eafff3}.lv-warn{background:#f1c76c;color:#2b1d00}.lv-critical{background:#b3261e;color:#fff0ee}
.studio-wrap{padding:0!important;max-width:none!important}
.studio{display:flex;flex-direction:column;height:calc(100vh - 64px);min-height:520px}
.st-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--side)}
.st-bar select,.st-bar input[type=text],.st-bar input[type=number]{width:auto;padding:6px 9px;font-size:12px}.st-bar input[type=number]{width:72px}
.st-bar .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}.tb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tb input[type=color],.pf input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.st-stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#020e18 radial-gradient(rgba(105,229,255,.1) 1px,transparent 1px) 0 0/22px 22px}
.st-scroll{position:absolute;inset:0;overflow:auto;padding:40px 320px 120px 40px}
.st-sizer{position:relative}.st-canvas{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px var(--line2),0 30px 80px rgba(0,0,0,.5);background-image:linear-gradient(#0a2b46,#031827)}
.blk{position:absolute;cursor:move;user-select:none;touch-action:none}.blk.sel{outline:2px solid var(--cyan)}.blk.editing{cursor:text;user-select:text}
.bt{width:100%;height:100%;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
.hnd{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--cyan);border-radius:3px}
.hnd[data-h=nw]{left:-7px;top:-7px;cursor:nwse-resize}.hnd[data-h=ne]{right:-7px;top:-7px;cursor:nesw-resize}.hnd[data-h=sw]{left:-7px;bottom:-7px;cursor:nesw-resize}.hnd[data-h=se]{right:-7px;bottom:-7px;cursor:nwse-resize}
.st-panel{position:absolute;z-index:5;display:flex;flex-direction:column;max-height:calc(100% - 28px);background:rgba(3,22,38,.96);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.st-ph{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;cursor:grab;border-bottom:1px solid var(--line);font-size:12px;touch-action:none}.st-ph b{margin-right:auto}
.st-min{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}.st-min:hover{color:var(--cyan);border-color:var(--cyan)}
.st-pb{padding:12px;overflow:auto}.st-panel.min .st-pb{display:none}.st-panel.min{width:auto!important;min-width:150px}.st-panel.min .st-ph{border-bottom:0}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:8px}.pf{display:block}.pf>span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.pf input[type=number],.pf select,.pf textarea{padding:6px 8px;font-size:12px}.pf textarea{min-height:64px}.pf input[type=range]{width:100%}
.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:170px;overflow:auto}.assets img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:grab}.assets img:hover{border-color:var(--cyan)}
.ly{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}.ly b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ly span{width:18px;color:var(--cyan);text-align:center}.ly:hover{background:rgba(255,255,255,.05)}.ly.on{background:rgba(101,234,255,.12)}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginView" class="login" hidden>
  <div class="card">
    <h1>Mirage <span>Access</span></h1>
    <label class="f"><span>Authorization token</span><input id="tok" type="password" autocomplete="off" autofocus></label>
    <button class="btn primary" id="loginBtn" style="width:100%;justify-content:center;padding:12px">Continue</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="appView" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="../assets/mirage-m.svg" alt="">Mirage Access</div>
    <div id="nav"></div>

<script>
/* ================================================================
   Mirage Access: edits /content.json (and uploads to /assets/uploads)
   ================================================================ */
const $=s=>document.querySelector(s);
const FILE="content.json",UP="assets/uploads";
let S=null,ORIG="",SHA=null,TAB="dash",COMMITS=null;
let CFG={repo:"stickyfm-byte/mirage",branch:"main",token:""};

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="toast show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="toast",bad?5500:2600)}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>{let r="";new TextEncoder().encode(s).forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const get=(o,p)=>p.split(".").reduce((x,k)=>x==null?x:x[k],o);
function set(o,p,v){const k=p.split(".");const l=k.pop();let x=o;k.forEach(a=>{if(typeof x[a]!=="object"||x[a]==null)x[a]={};x=x[a]});x[l]=v}
const ser=o=>JSON.stringify(o,null,2)+"\n";
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";if(s<2592000){const d=Math.floor(s/86400);return d+(d===1?" day ago":" days ago")};return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};

/* ---------------- defaults ---------------- */
const uid=()=>"q"+Math.random().toString(36).slice(2,10);
const CORE_DEFAULT=()=>[{key:"Minecraft Username",label:"Minecraft username",placeholder:"Your in-game name"},{key:"Email",label:"Email",placeholder:"you@example.com"},{key:"Discord",label:"Discord username",placeholder:"username"},{key:"Age",label:"Age",placeholder:"13 or older"}];
function normalise(c){
  c=c||{};
  c.site=Object.assign({serverIp:"mc.miragesmp.org",discordUrl:"https://discord.gg/mirageevents"},c.site);
  c.site.announcement=Object.assign({enabled:false,text:"",link:"",linkLabel:""},c.site.announcement);
  c.banners=(Array.isArray(c.banners)?c.banners:[]).map(b=>Object.assign({id:uid(),enabled:true,level:"info",text:"",link:"",linkLabel:"",dismissible:true,start:"",end:""},b));
  if(!c.banners.length&&c.site.announcement.enabled&&c.site.announcement.text){c.banners.push({id:uid(),enabled:true,level:"info",text:c.site.announcement.text,link:c.site.announcement.link||"",linkLabel:c.site.announcement.linkLabel||"",dismissible:false,start:"",end:""});c.site.announcement.enabled=false}
  c.canvas=c.canvas&&Array.isArray(c.canvas.pages)?c.canvas:{pages:[]};
  c.hero=Object.assign({tag:"",titleLine1:"",titleLine2:"",text:"",buttonLabel:""},c.hero);
  c.sections=Object.assign({videosEyebrow:"",videosTitle:"",creatorsEyebrow:"",creatorsTitle:""},c.sections);
  c.videos=(c.videos||[]).map(v=>typeof v==="string"?{id:v,title:""}:{id:v.id,title:v.title||""});
  c.videoRail=Object.assign({speed:44},c.videoRail);
  c.creators=c.creators||[];
  c.status=Object.assign({homeTitle:"",pageTitle:"",pageText:"",items:[]},c.status);
  c.disclaimer=Object.assign({title:"",paragraphs:[]},c.disclaimer);
  c.eula=Object.assign({title:"",text:"",buttonLabel:"",url:""},c.eula);
  c.updates=Object.assign({title:"",text:"",items:[]},c.updates);
  c.footer=Object.assign({officialLinks:[],emails:[],copyright:""},c.footer);
  c.forms=Object.assign({title:"",text:"",rolesHeading:"",successTitle:"",successText:"",submitLabel:"Send application",privacyNote:"",minAge:13,roles:[]},c.forms);
  c.forms.core=Object.assign({legend:"About you",sub:"",fields:[]},c.forms.core);
  if(!c.forms.core.fields.length) c.forms.core.fields=CORE_DEFAULT();
  c.forms.roles=(c.forms.roles||[]).map(r=>Object.assign({name:"",open:true,note:"",closesOn:"",color:"#5865F2",legend:"Your application",sub:"",introTitle:"",introText:"",questions:[]},r));
  c.forms.roles.forEach(r=>{r.questions=(r.questions||[]).map(q=>Object.assign({id:uid(),label:"",type:"text",required:false,placeholder:"",help:"",width:"full",maxLength:200,options:[]},q));});
  c.site.showLabels=!!c.site.showLabels;
  c.support=Object.assign({eyebrow:"",title:"",text:"",cardEyebrow:"",cardTitle:"",cardText:"",securityTitle:"",securityNote:"",tipsTitle:"",tips:[],contactsTitle:"",discordLabel:"",buttonLabel:"",buttonUrl:""},c.support);
  c.legal=Object.assign({title:"",text:""},c.legal);
  return c;
}

/* ---------------- GitHub ---------------- */
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+CFG.token,"X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})}));
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||("Error "+r.status));e.status=r.status;throw e}
  return j;
}
const R=p=>`/repos/${CFG.repo}/${p}`;
async function loadContent(){
  const repo=await gh("/repos/"+CFG.repo);
  if(!repo.permissions||!repo.permissions.push) throw new Error("no write");
  try{
    const f=await gh(R(`contents/${FILE}?ref=${encodeURIComponent(CFG.branch)}&t=${Date.now()}`));
    SHA=f.sha;return JSON.parse(unb64(f.content));
  }catch(e){
    if(e.status!==404) throw e;
    SHA=null;const r=await fetch("../"+FILE,{cache:"no-store"});return r.ok?r.json():{};
  }
}
async function publish(){
  const v=validateForms();
  if(v.errors.length){APP.sub="roles";APP.role=Math.max(0,v.errors[0].role||0);go("forms");toast("Fix the highlighted application problems first.",true);return}
  const btn=$("#publishBtn");btn.disabled=true;btn.textContent="Publishing…";
  try{
    const body={message:"Update site content via Mirage Access",content:b64(ser(S)),branch:CFG.branch};
    if(SHA) body.sha=SHA;
    const res=await gh(R(`contents/${FILE}`),{method:"PUT",body:JSON.stringify(body)});
    SHA=res.content.sha;ORIG=ser(S);store.del("mirageDraft");COMMITS=null;
    toast("Published. The live site updates in about a minute.");
    if(TAB==="dash"||TAB==="history")render(true);
  }catch(e){
    if(e.status===409||e.status===422) toast("Someone else changed the content. Download a backup from History, sign in again and re-apply.",true);
    else if(e.status===401||e.status===403) toast("Not allowed to publish.",true);
    else toast("Publish failed: "+e.message,true);
  }
  btn.textContent="Publish changes";refreshState();
}

/* ---------------- state ---------------- */
let pvTimer,PV_ROLE="";
function refreshState(){
  const dirty=ser(S)!==ORIG;
  const st=$("#state");st.textContent=dirty?"Unpublished changes":"Published";st.className="pill "+(dirty?"dirty":"clean");
  $("#publishBtn").disabled=!dirty;$("#discardBtn").disabled=!dirty;
  if(dirty) store.set("mirageDraft",ser(S));
  const c={videos:S.videos.length,creators:S.creators.length,updates:S.updates.items.length};
  Object.entries(c).forEach(([k,v])=>{const n=document.querySelector(`[data-tab="${k}"] .n`);if(n)n.textContent=v});
  clearTimeout(pvTimer);pvTimer=setTimeout(syncPreview,450);
}
window.addEventListener("beforeunload",e=>{if(S&&ser(S)!==ORIG){e.preventDefault();e.returnValue=""}});
const touch=()=>refreshState();

/* ---------------- preview ---------------- */
function syncPreview(){
  if($("#pv").hidden)return;
  store.set("mirage-preview",JSON.stringify(S));
  const f=$("#pvFrame"),page=$("#pvPage").value;
  f.src=page+"?preview=1"+(page==="/forms/"&&PV_ROLE?"&role="+encodeURIComponent(PV_ROLE):"")+"&t="+Date.now();
}
$("#pvBtn").addEventListener("click",()=>{const p=$("#pv");p.hidden=!p.hidden;document.documentElement.style.setProperty("--pv",p.hidden?"0px":"minmax(380px,44vw)");$("#pvBtn").classList.toggle("on",!p.hidden);if(!p.hidden)syncPreview()});
$("#pvClose").addEventListener("click",()=>$("#pvBtn").click());
$("#pvReload").addEventListener("click",syncPreview);
$("#pvPage").addEventListener("change",()=>{PV_ROLE="";syncPreview()});
function previewRole(name){PV_ROLE=name;$("#pvPage").value="/forms/";if($("#pv").hidden)$("#pvBtn").click();else syncPreview()}
window.rr=()=>render(true);
$("#pvDevice").addEventListener("click",()=>{const b=$("#pvBody");b.classList.toggle("phone");$("#pvDevice").textContent=b.classList.contains("phone")?"Desktop":"Phone"});

/* ---------------- builders ---------------- */
function F(label,path,o={}){
  const v=get(S,path);const tag=o.area?"textarea":"input";
  return `<label class="f"><span>${esc(label)}</span><${tag} ${o.area?`rows="${o.rows||3}"`:`type="${o.type||"text"}" value="${esc(v)}"`} data-bind="${path}" ${o.ph?`placeholder="${esc(o.ph)}"`:""}>${o.area?esc(v)+"</textarea>":""}</label>`;
}
const SW=(label,path,sub)=>`<label class="sw"><input type="checkbox" data-bind="${path}" ${get(S,path)?"checked":""}><i></i><span>${esc(label)}${sub?` <small>${esc(sub)}</small>`:""}</span></label>`;
function bindAll(root){
  root.querySelectorAll("[data-bind]").forEach(n=>{
    const h=()=>{let v=n.type==="checkbox"?n.checked:n.value;if(n.type==="range"||n.type==="number")v=Number(v);set(S,n.dataset.bind,v);touch();if(n.dataset.after&&window[n.dataset.after])window[n.dataset.after]()};
    n.addEventListener(n.type==="checkbox"||n.tagName==="SELECT"?"change":"input",h);
  });
  root.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
}
function listHTML(path,fn,label){
  return get(S,path).map((it,i)=>`<div class="item" data-list="${path}" data-i="${i}">
    <div class="item-head"><b>${esc(label)} ${i+1}</b><button class="ibtn" data-act="up" title="Move up" aria-label="Move up">↑</button><button class="ibtn" data-act="down" title="Move down" aria-label="Move down">↓</button><button class="ibtn x" data-act="del" title="Remove" aria-label="Remove">✕</button></div>
    ${fn(it,i,path+"."+i)}</div>`).join("");
}
function wireLists(root){
  root.querySelectorAll(".item[data-list] [data-act]").forEach(b=>b.addEventListener("click",()=>{
    const it=b.closest(".item"),path=it.dataset.list,i=+it.dataset.i,arr=get(S,path);
    if(b.dataset.act==="del"){if(!confirm("Remove this item?"))return;arr.splice(i,1)}
    if(b.dataset.act==="up"&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(b.dataset.act==="down"&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
    touch();render(true);
  }));
  root.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{
    get(S,b.dataset.add).push(JSON.parse(b.dataset.tpl));touch();render(true);
    const it=document.querySelectorAll("#panel .item");const l=it[it.length-1];if(l){l.scrollIntoView({block:"center"});const i=l.querySelector("input[type=text],textarea");i&&i.focus()}
  }));
}
const addBtn=(path,tpl,label)=>`<div class="addbar"><button class="btn" data-add="${path}" data-tpl='${esc(JSON.stringify(tpl))}'>＋ ${esc(label)}</button></div>`;
function ytId(s){
  s=String(s||"").trim();if(/^[\w-]{11}$/.test(s))return s;
  try{const u=new URL(s.startsWith("http")?s:"https://"+s);
    if(u.hostname.includes("youtu.be"))return u.pathname.slice(1).split("/")[0].slice(0,11)||null;
    if(u.searchParams.get("v"))return u.searchParams.get("v").slice(0,11);
    const m=u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);if(m)return m[1];
  }catch(e){}
  return null;
}

/* ---------------- navigation ---------------- */
const I={
dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',

updates:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1"/><circle cx="12" cy="12" r="3"/>',

const NAV=[
 ["Overview",[["dash","Dashboard"]]],
 ["Website",[["home","Homepage"],["videos","Videos"],["creators","Creators"],["updates","Changelog"],["alerts","Alerts & banners"],["site","Server & Discord"]]],

/* ---------------- application builder ---------------- */
let APP={sub:"roles",role:0,open:new Set()};
const QTYPES={text:"Short answer",textarea:"Long answer",number:"Number",email:"Email",url:"Link",select:"Dropdown",radio:"Choose one",checkbox:"Choose many",yesno:"Yes / No"};
const HAS_OPTS=t=>["select","radio","checkbox"].includes(t);
const HAS_LEN=t=>["text","textarea","email","url"].includes(t);
const newQ=(label,type="textarea",o={})=>Object.assign({id:uid(),label,type,required:true,placeholder:"",help:"",width:"full",maxLength:type==="textarea"?1000:200,options:[]},o);
const TEMPLATES={
 blank:{name:"Blank: one long answer",make:()=>[newQ("Application","textarea",{placeholder:"Tell us about yourself, your experience and your availability."}),newQ("Additional Information","textarea",{required:false,placeholder:"Anything else the team should know"})]},
 staff:{name:"Staff role: availability and scenario",make:()=>[newQ("Timezone","text",{width:"half",maxLength:100}),newQ("Availability","text",{width:"half",maxLength:300}),newQ("Past experience","textarea"),newQ("Why do you want this role?","textarea"),newQ("Scenario: how would you handle a player breaking the rules?","textarea"),newQ("Additional Information","textarea",{required:false})]},
 creative:{name:"Creative role: portfolio and experience",make:()=>[newQ("Portfolio link","url",{required:false,placeholder:"https://"}),newQ("Previous work and experience","textarea"),newQ("Why do you want to join Mirage?","textarea"),newQ("Additional Information","textarea",{required:false})]}
};
const COLORS=["#5865F2","#57F287","#FEE75C","#EB459E","#ED4245","#3BA9FF","#FFA24C"];
function qSize(q){
  if(HAS_LEN(q.type)) return Math.min(Number(q.maxLength)||(q.type==="textarea"?1000:200),1000);
  if(q.type==="checkbox") return Math.min(q.options.join(", ").length,1000);
  if(HAS_OPTS(q.type)) return Math.max(0,...q.options.map(o=>o.length));
  return q.type==="yesno"?3:20;
}
function roleSize(r){
  const core=S.forms.core.fields.reduce((n,f)=>n+f.key.length+(f.key==="Email"?200:f.key==="Age"?3:100),0);
  return core+4+r.name.length+r.questions.reduce((n,q)=>n+q.label.length+qSize(q),0);
}
function validateForms(){
  const errors=[],warns=[],names=new Set(),reserved=new Set(["Role",...S.forms.core.fields.map(f=>f.key)]);
  S.forms.roles.forEach((r,ri)=>{
    const n=r.name.trim(),rn=n||("Role "+(ri+1));
    if(!n) errors.push({role:ri,msg:`Role ${ri+1} needs a name.`});
    else if(names.has(n.toLowerCase())) errors.push({role:ri,msg:`"${rn}" is used for more than one role.`});
    names.add(n.toLowerCase());
    const seen=new Set();
    r.questions.forEach((q,qi)=>{
      const l=q.label.trim();
      if(!l) errors.push({role:ri,msg:`${rn}: question ${qi+1} has no text.`});
      else if(seen.has(l.toLowerCase())) errors.push({role:ri,msg:`${rn}: "${l}" appears twice.`});
      else if(reserved.has(l)) errors.push({role:ri,msg:`${rn}: "${l}" is already a common question. Reword it.`});
      seen.add(l.toLowerCase());
      if(HAS_OPTS(q.type)&&q.options.length<2) errors.push({role:ri,msg:`${rn}: "${l||"question "+(qi+1)}" needs at least two options.`});
    });
    if(1+S.forms.core.fields.length+r.questions.length>40) errors.push({role:ri,msg:`${rn} has too many questions. The limit is 40 including the common ones.`});
    if(roleSize(r)>12000) warns.push(`${rn}: if every answer was at its maximum length the application would be over 12,000 characters and be rejected. Lower some maximum lengths.`);
    if(!r.questions.length) warns.push(`${rn} has no questions.`);
  });
  return {errors,warns};
}
const roleStatus=r=>!r.open?["bad","Closed"]:(r.closesOn&&new Date(r.closesOn+"T23:59:59")<new Date())?["bad","Auto-closed"]:["ok",r.closesOn?"Open until "+r.closesOn:"Open"];
function qHTML(q,ri,qi){
  const p=`forms.roles.${ri}.questions.${qi}`,open=APP.open.has(q.id);
  const body=open?`<div class="qbody">
    <label class="f"><span>Question</span><input type="text" data-bind="${p}.label" data-qlabel value="${esc(q.label)}"></label>
    <div class="grid2"><label class="f"><span>Answer type</span><select data-bind="${p}.type" data-after="rr">${Object.entries(QTYPES).map(([k,l])=>`<option value="${k}" ${q.type===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f"><span>Width</span><select data-bind="${p}.width"><option value="full" ${q.width!=="half"?"selected":""}>Full width</option><option value="half" ${q.width==="half"?"selected":""}>Half width (pairs with the next half)</option></select></label></div>
    ${SW("Required",p+".required")}<div style="height:14px"></div>
    ${F("Help text under the question (optional)",p+".help")}
    ${(q.type==="yesno"||q.type==="radio"||q.type==="checkbox")?"":F(q.type==="select"?"Prompt shown before choosing":"Placeholder",p+".placeholder")}
    ${HAS_LEN(q.type)?F("Maximum characters",p+".maxLength",{type:"number"}):""}
    ${HAS_OPTS(q.type)?`<label class="f"><span>Options (one per line, at least two)</span><textarea data-opts="${ri}.${qi}" rows="4">${esc(q.options.join("\n"))}</textarea></label>`:""}</div>`:"";
  return `<div class="q ${open?"open":""}" data-qid="${q.id}"><div class="qhead" data-qt="${ri}.${qi}"><span class="qtype">${QTYPES[q.type]||q.type}</span><b class="qtitle">${esc(q.label||"(no question text)")}</b>${q.required?'<span class="qreq">required</span>':""}

window.spd=()=>{$("#spv").textContent=S.videoRail.speed};
function addVideos(text,after){
  const parts=text.split(/[\s,]+/).filter(Boolean);if(!parts.length)return false;
  let added=0,dup=0,bad=[];
  parts.forEach(l=>{const id=ytId(l);if(!id){bad.push(l);return}if(S.videos.some(v=>v.id===id)){dup++;return}S.videos.push({id,title:""});added++});
  touch();after(bad);
  toast(`${added} added`+(dup?`, ${dup} already in the list`:"")+(bad.length?`, ${bad.length} not recognised`:""),!!bad.length&&!added);
  S.videos.slice(-added).filter(v=>!v.title).forEach(async v=>{
    try{const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+v.id));const j=await r.json();
      if(j.title&&!v.title){v.title=j.title;const inp=document.querySelector(`[data-vt="${S.videos.indexOf(v)}"]`);if(inp)inp.value=j.title;touch()}}catch(e){}});
  return true;
}
async function uploadFile(file){
  if(file.size>5*1024*1024) throw new Error(file.name+" is over 5 MB");
  const buf=new Uint8Array(await file.arrayBuffer());let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  const dot=file.name.lastIndexOf(".");const ext=(dot>0?file.name.slice(dot):".png").toLowerCase().replace(/[^.\w]/g,"");
  const slug=(dot>0?file.name.slice(0,dot):file.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"image";
  const path=`${UP}/${slug}-${Date.now().toString(36)}${ext}`;
  await gh(R(`contents/${path}`),{method:"PUT",body:JSON.stringify({message:"Upload image via Mirage Access",content:btoa(bin),branch:CFG.branch})});
  return path;
}
async function listUploads(){
  try{return (await gh(R(`contents/${UP}?ref=${encodeURIComponent(CFG.branch)}&t=${Date.now()}`))).filter(f=>f.type==="file"&&/\.(png|jpe?g|webp|gif|svg)$/i.test(f.name))}catch(e){if(e.status===404)return[];throw e}
}
async function getCommits(){
  if(!COMMITS)COMMITS=await gh(R(`commits?path=${FILE}&sha=${encodeURIComponent(CFG.branch)}&per_page=20`));
  return COMMITS;
}

videos(p){
  const ta=$("#vnew");
  const add=()=>{if(addVideos(ta.value,bad=>{ta.value=bad.join("\n")}))render(true)};
  $("#vaddBtn").addEventListener("click",add);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();add()}});
  ta.addEventListener("paste",()=>setTimeout(()=>{if(/\n/.test(ta.value.trim()))add()},0));
  p.querySelectorAll("[data-vt]").forEach(i=>i.addEventListener("input",()=>{S.videos[+i.dataset.vt].title=i.value;touch()}));
  p.querySelectorAll("[data-vx]").forEach(b=>b.addEventListener("click",()=>{S.videos.splice(+b.dataset.vx,1);touch();render(true)}));
  p.querySelectorAll("[data-vm]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.vm,j=i+ +b.dataset.d;if(j<0||j>=S.videos.length)return;[S.videos[i],S.videos[j]]=[S.videos[j],S.videos[i]];touch();render(true)}));
  p.querySelectorAll(".vc").forEach(c=>{
    c.addEventListener("dragstart",e=>{c.classList.add("drag");e.dataTransfer.setData("text/plain",c.dataset.i);e.dataTransfer.effectAllowed="move"});
    c.addEventListener("dragend",()=>{c.classList.remove("drag");p.querySelectorAll(".over").forEach(o=>o.classList.remove("over"))});
    c.addEventListener("dragover",e=>{e.preventDefault();c.classList.add("over")});
    c.addEventListener("dragleave",()=>c.classList.remove("over"));
    c.addEventListener("drop",e=>{e.preventDefault();const f=+e.dataTransfer.getData("text/plain"),t=+c.dataset.i;if(isNaN(f)||f===t)return;const [m]=S.videos.splice(f,1);S.videos.splice(t,0,m);touch();render(true)});
  });
  setTimeout(()=>p.querySelectorAll(".vc.broken .vbad").forEach(x=>x.hidden=false),700);
},
creators(p){
  p.querySelectorAll("[data-up]").forEach(inp=>inp.addEventListener("change",async()=>{
    const f=inp.files[0];if(!f)return;toast("Uploading…");
    try{const path=await uploadFile(f);set(S,inp.dataset.up,path);touch();render(true);toast("Uploaded")}catch(e){toast("Upload failed: "+e.message,true)}
  }));
},
forms(p){
  p.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>{APP.sub=b.dataset.sub;render()}));
  p.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{APP.role=+b.dataset.role;render()}));
  const nr=$("#newRole");
  if(nr) nr.addEventListener("click",()=>{
    const v=$("#newTpl").value;let qs;
    if(v.startsWith("copy:")){qs=JSON.parse(JSON.stringify(S.forms.roles[+v.slice(5)].questions)).map(q=>({...q,id:uid()}))}else qs=TEMPLATES[v].make();
    const src=v.startsWith("copy:")?S.forms.roles[+v.slice(5)]:null;
    S.forms.roles.push(Object.assign({name:"",open:true,note:"",closesOn:"",color:COLORS[S.forms.roles.length%COLORS.length],legend:"Your application",sub:"Tell us about yourself, your experience and your availability.",introTitle:"",introText:""},src?{legend:src.legend,sub:src.sub,introTitle:src.introTitle,introText:src.introText,color:src.color}:{},{questions:qs}));
    APP.role=S.forms.roles.length-1;touch();render();
    const n=document.querySelector('[data-bind$=".name"]');n&&n.focus();
  });
  p.querySelectorAll("[data-rpv]").forEach(b=>b.addEventListener("click",()=>previewRole(b.dataset.rpv)));
  p.querySelectorAll("[data-rmv]").forEach(b=>b.addEventListener("click",()=>{
    const i=APP.role,j=i+ +b.dataset.rmv,a=S.forms.roles;if(j<0||j>=a.length)return;
    [a[i],a[j]]=[a[j],a[i]];APP.role=j;touch();render(true)}));
  p.querySelectorAll("[data-rdel]").forEach(b=>b.addEventListener("click",()=>{
    const r=S.forms.roles[+b.dataset.rdel];if(!confirm(`Delete the "${r.name||"unnamed"}" role and all its questions?`))return;
    S.forms.roles.splice(+b.dataset.rdel,1);APP.role=Math.max(0,APP.role-1);touch();render()}));
  p.querySelectorAll(".qhead").forEach(h=>h.addEventListener("click",e=>{
    if(e.target.closest("[data-qa]"))return;
    const [ri,qi]=h.dataset.qt.split(".").map(Number),id=S.forms.roles[ri].questions[qi].id;
    APP.open.has(id)?APP.open.delete(id):APP.open.add(id);render(true)}));
  p.querySelectorAll("[data-qa]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const [ri,qi]=b.dataset.qi.split(".").map(Number),qs=S.forms.roles[ri].questions,a=b.dataset.qa;
    if(a==="del"){if(!confirm("Delete this question?"))return;qs.splice(qi,1)}
    if(a==="dup"){const c={...JSON.parse(JSON.stringify(qs[qi])),id:uid()};c.label+=" (copy)";qs.splice(qi+1,0,c);APP.open.add(c.id)}
    if(a==="up"&&qi>0)[qs[qi-1],qs[qi]]=[qs[qi],qs[qi-1]];
    if(a==="down"&&qi<qs.length-1)[qs[qi+1],qs[qi]]=[qs[qi],qs[qi+1]];
    touch();render(true)}));
  const nq=$("#newQ");
  if(nq) nq.addEventListener("click",()=>{
    const r=S.forms.roles[APP.role],t=$("#newQType").value;
    const q=newQ("",t,{options:HAS_OPTS(t)?["Option 1","Option 2"]:[]});r.questions.push(q);APP.open.add(q.id);touch();render();
    const el=document.querySelector(`[data-qid="${q.id}"] [data-qlabel]`);if(el){el.scrollIntoView({block:"center"});el.focus()}
  });
  p.querySelectorAll("[data-opts]").forEach(t=>t.addEventListener("input",()=>{
    const [ri,qi]=t.dataset.opts.split(".").map(Number);
    S.forms.roles[ri].questions[qi].options=t.value.split("\n").map(x=>x.trim()).filter(Boolean);touch()}));
  p.querySelectorAll("[data-qlabel]").forEach(i=>i.addEventListener("input",()=>{
    const t=i.closest(".q").querySelector(".qtitle");if(t)t.textContent=i.value||"(no question text)"}));
},
updates(){
  $("#newestUpdate").addEventListener("click",()=>{
    const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
    S.updates.items.unshift({date:d,title:"",body:""});touch();render(true);
    const f=document.querySelector("#panel .item input");f&&f.focus();
  });
},
media(p){
  const draw=async()=>{
    const g=$("#mgrid");
    try{
      const files=await listUploads();
      g.innerHTML=files.length?files.map(f=>`<div class="mc"><div class="im"><img src="../${esc(f.path)}" alt="" loading="lazy"></div><div class="cap" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="vact"><button class="ibtn" data-copy="${esc(f.path)}" title="Copy path" aria-label="Copy path">⧉</button><button class="ibtn x" data-del="${esc(f.path)}" data-sha="${f.sha}" aria-label="Delete">✕</button></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">No uploads yet.</div>`;
      g.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast("Path copied")}catch(e){toast(b.dataset.copy)}}));
      g.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
        if(!confirm("Delete this image from the site?"))return;
        try{await gh(R(`contents/${b.dataset.del}`),{method:"DELETE",body:JSON.stringify({message:"Delete image via Mirage Access",sha:b.dataset.sha,branch:CFG.branch})});toast("Deleted");draw()}catch(e){toast("Delete failed: "+e.message,true)}
      }));
    }catch(e){g.innerHTML=`<p class="hint">Couldn't load uploads.</p>`}
  };
  const send=async files=>{
    for(const f of files){
      if(!f.type.startsWith("image/")){toast(f.name+" isn't an image",true);continue}
      toast("Uploading "+f.name+"…");
      try{await uploadFile(f)}catch(e){toast("Upload failed: "+e.message,true);return}
    }
    toast("Uploaded");draw();
  };
  $("#mfile").addEventListener("change",e=>{send([...e.target.files]);e.target.value=""});
  const d=$("#drop");
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over")}));
  d.addEventListener("drop",e=>send([...e.dataTransfer.files]));
  draw();
},
history(){
  $("#dlBtn").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ser(S)],{type:"application/json"}));a.download="mirage-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
  $("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{S=normalise(JSON.parse(await f.text()));render();toast("Backup loaded. Review it, then publish.")}catch(x){toast("That file isn't valid.",true)}e.target.value=""});
  getCommits().then(cs=>{
    $("#vers").innerHTML=cs.map((c,i)=>`<div class="ver"><div><b>${esc(c.commit.message.split("\n")[0])}</b><small>${esc(c.commit.author.name)} · ${ago(c.commit.author.date)}</small></div>${i===0?'<span class="tag">Live</span>':`<button class="btn sm" data-load="${c.sha}">Load</button>`}</div>`).join("")||`<p class="hint">No versions yet.</p>`;
    $("#vers").querySelectorAll("[data-load]").forEach(b=>b.addEventListener("click",async()=>{
      if(!confirm("Load this version into the editor? Your current unpublished edits will be replaced."))return;
      try{const f=await gh(R(`contents/${FILE}?ref=${b.dataset.load}`));S=normalise(JSON.parse(unb64(f.content)));toast("Version loaded. Publish to make it live.");go("dash")}catch(e){toast("Couldn't load that version.",true)}
    }));
  }).catch(()=>{$("#vers").innerHTML=`<p class="hint">Couldn't load history.</p>`});
}
};

const LEVELS={info:"Info",success:"Good news",warn:"Warning",critical:"Critical"};
const bnHTML=(b,i)=>`<div class="item" data-bn="${i}">
  <div class="item-head"><b>Banner ${i+1}</b><button class="ibtn" data-bnact="up" data-i="${i}" title="Move up">↑</button><button class="ibtn" data-bnact="down" data-i="${i}" title="Move down">↓</button><button class="ibtn x" data-bnact="del" data-i="${i}" title="Delete">✕</button></div>
  <div class="bnp alert-bar lv-${b.level}${b.enabled?"":" off"}"><span>${esc(b.text||"Your message appears here")}</span></div>
  <div class="row" style="margin-bottom:16px;gap:24px;flex-wrap:wrap">${SW("Show on site","banners."+i+".enabled")}${SW("Visitors can dismiss","banners."+i+".dismissible")}</div>
  <div class="grid2"><label class="f"><span>Type</span><select data-bind="banners.${i}.level">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${b.level===k?"selected":""}>${v}</option>`).join("")}</select></label>${F("Message","banners."+i+".text")}</div>
  <div class="grid2">${F("Link (optional)","banners."+i+".link",{type:"url"})}${F("Link label","banners."+i+".linkLabel",{ph:"Learn more ↗"})}</div>

VIEWS.alerts=()=>`<div class="card"><h2>Alerts & banners</h2><p class="hint">Coloured strips across the top of every page. Use them for downtime, events or urgent notices. Run several at once and schedule each one. Nothing goes live until you publish.</p>
  ${S.banners.length?S.banners.map(bnHTML).join(""):`<div class="empty">No banners yet.</div>`}
  <div class="addbar"><button class="btn primary" data-bnadd="info">+ Add banner</button><button class="btn" data-bnadd="warn">+ Downtime warning</button><button class="btn danger" data-bnadd="critical">+ Critical alert</button></div></div>`;
AFTER.alerts=p=>{
  p.querySelectorAll("[data-bnadd]").forEach(b=>b.addEventListener("click",()=>{const lv=b.dataset.bnadd;S.banners.push({id:uid(),enabled:true,level:lv,text:lv==="warn"?"Scheduled maintenance: the server may be offline for a short while.":lv==="critical"?"The server is currently down. We're working on it.":"",link:"",linkLabel:"",dismissible:lv!=="critical",start:"",end:""});touch();render(true)}));
  p.querySelectorAll("[data-bnact]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i,a=b.dataset.bnact,L=S.banners;if(a==="del"){if(!confirm("Delete this banner?"))return;L.splice(i,1)}else{const j=a==="up"?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]]}touch();render(true)}));
  p.querySelectorAll("[data-bn]").forEach(it=>{const upd=()=>{const b=S.banners[+it.dataset.bn],pr=it.querySelector(".bnp");pr.className="bnp alert-bar lv-"+b.level+(b.enabled?"":" off");pr.firstChild.textContent=b.text||"Your message appears here"};it.addEventListener("input",upd);it.addEventListener("change",upd)});
};

/* ================================================================
   Design studio: drag-and-drop page editor
   ================================================================ */
const FONTS=["Manrope","Inter","Cinzel","Playfair Display","Georgia","JetBrains Mono"];
const ST={pg:0,sel:null,zoom:.7,url:{},assets:[],loaded:false};
const stPg=()=>S.canvas.pages[ST.pg];
const stBlk=id=>stPg().blocks.find(b=>b.id===id);
const stSrc=s=>ST.url[s]||".."+s;
const stZ=()=>stPg().blocks.reduce((m,b)=>Math.max(m,b.z||0),0)+1;
const newPage=n=>({id:(n||"page").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Math.random().toString(36).slice(2,5),name:n||"New page",w:1200,h:700,bg:"",blocks:[]});
const BLK={
  text:()=>({t:"text",w:440,h:90,text:"Double-click to edit",font:"Manrope",size:40,weight:500,color:"#eafaff",align:"left"}),
  box:()=>({t:"box",w:320,h:180,bg:"#0b70a6",r:16,op:.35}),
  img:src=>({t:"img",w:360,h:240,src,r:14,fit:"cover"})
};
function stAdd(kind,arg,x,y){
  const b=Object.assign({id:uid(),x:x==null?80:x,y:y==null?80:y,z:stZ()},BLK[kind](arg));
  stPg().blocks.push(b);touch();stDraw();stSelect(b.id);return b;
}
function mkBlk(b){
  const e=document.createElement("div");e.className="blk";e.dataset.id=b.id;const s=e.style;
  s.left=b.x+"px";s.top=b.y+"px";s.width=b.w+"px";s.height=b.h+"px";s.zIndex=b.z||1;s.opacity=b.op==null?1:b.op;s.borderRadius=(b.r||0)+"px";
  if(b.t==="img"){const i=document.createElement("img");i.src=stSrc(b.src);i.draggable=false;i.style.cssText="width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none;object-fit:"+(b.fit||"cover");e.appendChild(i)}
  else{if(b.bg)s.background=b.bg;if(b.t==="text"){const t=document.createElement("div");t.className="bt";t.textContent=b.text;Object.assign(t.style,{fontFamily:'"'+b.font+'",sans-serif',fontSize:b.size+"px",fontWeight:b.weight,color:b.color,textAlign:b.align,lineHeight:1.25});e.appendChild(t)}}
  return e;
}
function stDraw(){
  const pg=stPg(),cv=$("#stCv");if(!cv)return;
  cv.style.cssText=`width:${pg.w}px;height:${pg.h}px;transform:scale(${ST.zoom});background:${pg.bg||"transparent"}`;
  const sz=$("#stSizer");sz.style.width=pg.w*ST.zoom+"px";sz.style.height=pg.h*ST.zoom+"px";
  cv.innerHTML="";pg.blocks.forEach(b=>cv.appendChild(mkBlk(b)));
  stSelect(pg.blocks.some(b=>b.id===ST.sel)?ST.sel:null,true);stLayers();
}
function stRepl(b){
  const old=$(`#stCv [data-id="${b.id}"]`);if(!old)return;const n=mkBlk(b);old.replaceWith(n);if(ST.sel===b.id)stMark();
}
function stMark(){
  document.querySelectorAll("#stCv .blk").forEach(e=>{e.classList.toggle("sel",e.dataset.id===ST.sel);e.querySelectorAll(".hnd").forEach(h=>h.remove());
    if(e.dataset.id===ST.sel)["nw","ne","sw","se"].forEach(h=>{const i=document.createElement("i");i.className="hnd";i.dataset.h=h;e.appendChild(i)})});
}
function stSelect(id,quiet){ST.sel=id;stMark();if(!quiet){stProps();stLayers()}else stProps()}
function stProps(){
  const box=$("#stProps");if(!box)return;const b=ST.sel&&stBlk(ST.sel);
  if(!b){box.innerHTML=`<p class="hint" style="margin:0">Select something on the canvas, or add text, a box or an image from the toolbar.</p>`;return}
  const n=(k,l,o="")=>`<label class="pf"><span>${l}</span><input type="number" data-k="${k}" value="${Math.round(b[k]*100)/100}" ${o}></label>`;
  const col=(k,l)=>`<label class="pf"><span>${l}</span><div class="row"><input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(b[k]||"")?b[k]:"#0b70a6"}"><button class="ibtn" data-clear="${k}" title="Clear">✕</button></div></label>`;
  let h=`<div class="pg">${n("x","X")}${n("y","Y")}${n("w","Width","min=20")}${n("h","Height","min=20")}</div>`;
  if(b.t==="text")h=`<label class="pf"><span>Text</span><textarea data-k="text" rows="3">${esc(b.text)}</textarea></label>
   <div class="pg"><label class="pf"><span>Font</span><select data-k="font">${FONTS.map(f=>`<option ${f===b.font?"selected":""}>${f}</option>`).join("")}</select></label>
   ${n("size","Size","min=8")}<label class="pf"><span>Weight</span><select data-k="weight">${[400,500,600].map(w=>`<option ${w==b.weight?"selected":""}>${w}</option>`).join("")}</select></label>
   <label class="pf"><span>Align</span><select data-k="align">${["left","center","right"].map(a=>`<option ${a===b.align?"selected":""}>${a}</option>`).join("")}</select></label>${col("color","Colour")}${col("bg","Background")}</div>`+h;
  else if(b.t==="box")h=`<div class="pg">${col("bg","Colour")}${n("r","Corner radius","min=0")}</div>`+h;
  else h=`<div class="pg"><label class="pf"><span>Fit</span><select data-k="fit">${["cover","contain"].map(a=>`<option ${a===b.fit?"selected":""}>${a}</option>`).join("")}</select></label>${n("r","Corner radius","min=0")}</div>`+h;
  h+=`<label class="pf"><span>Opacity</span><input type="range" data-k="op" min="0" max="1" step=".05" value="${b.op==null?1:b.op}"></label>
   <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px"><button class="btn sm" data-a="front">To front</button><button class="btn sm" data-a="back">To back</button><button class="btn sm" data-a="dup">Duplicate</button><button class="btn sm danger" data-a="del">Delete</button></div>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-k]").forEach(i=>{const go=()=>{const k=i.dataset.k;let v=i.value;if(i.type==="number"||i.type==="range")v=Number(v);if(k==="weight")v=Number(v);b[k]=v;stRepl(b);touch();if(k==="text"||k==="font"||k==="size")stLayers()};i.addEventListener(i.tagName==="SELECT"?"change":"input",go)});
  box.querySelectorAll("[data-clear]").forEach(x=>x.addEventListener("click",()=>{b[x.dataset.clear]="";stRepl(b);touch();stProps()}));
  box.querySelectorAll("[data-a]").forEach(x=>x.addEventListener("click",()=>stAct(x.dataset.a)));
}
function stAct(a){
  const L=stPg().blocks,b=ST.sel&&stBlk(ST.sel);if(!b)return;
  if(a==="del"){L.splice(L.indexOf(b),1);ST.sel=null}
  else if(a==="dup"){const c=JSON.parse(JSON.stringify(b));c.id=uid();c.x+=24;c.y+=24;c.z=stZ();L.push(c);ST.sel=c.id}
  else if(a==="front")b.z=stZ();
  else if(a==="back")b.z=L.reduce((m,x)=>Math.min(m,x.z||0),99)-1;
  touch();stDraw();stProps();
}
function stLayers(){
  const box=$("#stLayers");if(!box)return;
  const L=stPg().blocks.slice().sort((a,b)=>(b.z||0)-(a.z||0));
  box.innerHTML=L.length?L.map(b=>`<div class="ly ${b.id===ST.sel?"on":""}" data-id="${b.id}"><span>${b.t==="text"?"Aa":b.t==="img"?"▣":"▭"}</span><b>${esc(b.t==="text"?b.text:b.t==="img"?b.src.split("/").pop():"Box")}</b></div>`).join(""):`<p class="hint" style="margin:0">Nothing on this page yet.</p>`;
  box.querySelectorAll(".ly").forEach(r=>r.addEventListener("click",()=>stSelect(r.dataset.id)));
}
async function stUpload(files,x,y){
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    try{const path=await uploadFile(f);ST.url["/"+path]=URL.createObjectURL(f);ST.assets.unshift("/"+path);toast("Uploaded "+f.name);stAssets();stAdd("img","/"+path,x,y)}catch(e){toast(e.message,true)}
  }
}
function stAssets(){
  const box=$("#stAssets");if(!box)return;
  box.innerHTML=ST.assets.length?ST.assets.map(p=>`<img src="${esc(stSrc(p))}" data-p="${esc(p)}" draggable="true" title="Click to add, or drag onto the canvas">`).join(""):`<p class="hint" style="margin:0;grid-column:1/-1">No images yet. Upload one below.</p>`;
  box.querySelectorAll("img").forEach(i=>{i.addEventListener("click",()=>stAdd("img",i.dataset.p));i.addEventListener("dragstart",e=>e.dataTransfer.setData("text/mirage-asset",i.dataset.p))});
}
function panelDrag(p){
  const h=p.querySelector(".st-ph");
  h.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    const st=p.parentElement.getBoundingClientRect(),r=p.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    p.style.right=p.style.bottom="auto";p.style.left=r.left-st.left+"px";p.style.top=r.top-st.top+"px";h.setPointerCapture(e.pointerId);
    const mv=ev=>{p.style.left=Math.max(0,Math.min(st.width-60,ev.clientX-st.left-ox))+"px";p.style.top=Math.max(0,Math.min(st.height-36,ev.clientY-st.top-oy))+"px"};
    const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up)};
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);
  });
  p.querySelector(".st-min").addEventListener("click",e=>{p.classList.toggle("min");e.currentTarget.textContent=p.classList.contains("min")?"+":"–"});
}
VIEWS.studio=()=>`<div class="studio" id="studio"></div>`;

  if(ST.pg>=S.canvas.pages.length)ST.pg=0;
  const pg=stPg();
  $("#studio").innerHTML=`
  <div class="st-bar">
    <select id="stPages" aria-label="Page">${S.canvas.pages.map((p,i)=>`<option value="${i}" ${i===ST.pg?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <input type="text" id="stName" value="${esc(pg.name)}" style="width:140px" aria-label="Page name">
    <button class="btn sm" id="stNewPg">+ Page</button><button class="btn sm danger" id="stDelPg">Delete page</button>
    <span class="sep"></span>
    <button class="btn sm" id="stAddText">Aa Text</button><button class="btn sm" id="stAddBox">▭ Box</button><button class="btn sm" id="stAddImg">▣ Image</button>
    <span class="sep"></span>
    <label class="tb">W <input type="number" id="stW" value="${pg.w}" min="300"></label><label class="tb">H <input type="number" id="stH" value="${pg.h}" min="200"></label>
    <label class="tb">Bg <input type="color" id="stBg" value="${/^#[0-9a-f]{6}$/i.test(pg.bg||"")?pg.bg:"#031827"}"></label><button class="ibtn" id="stBgX" title="Transparent background">✕</button>
    <span class="sep"></span>
    <label class="tb">Zoom <input type="range" id="stZoom" min=".25" max="1.5" step=".05" value="${ST.zoom}"></label>
    <a class="btn sm" id="stOpen" target="_blank" rel="noopener">Open page ↗</a>
    <input type="file" id="stFile" accept="image/*" multiple hidden>
  </div>
  <div class="st-stage" id="stStage">
    <div class="st-scroll"><div class="st-sizer" id="stSizer"><div class="st-canvas" id="stCv"></div></div></div>
    <div class="st-panel" id="pProps" style="right:16px;top:14px;width:270px"><div class="st-ph"><b>Properties</b><button class="st-min" title="Minimise">–</button></div><div class="st-pb" id="stProps"></div></div>
    <div class="st-panel" id="pAssets" style="left:16px;bottom:16px;width:270px"><div class="st-ph"><b>Assets</b><button class="st-min" title="Minimise">–</button></div><div class="st-pb"><div class="assets" id="stAssets"></div><button class="btn sm" id="stUp" style="margin-top:10px;width:100%;justify-content:center">Upload images</button></div></div>
    <div class="st-panel" id="pLayers" style="right:16px;bottom:16px;width:250px;max-height:230px"><div class="st-ph"><b>Layers</b><button class="st-min" title="Minimise">–</button></div><div class="st-pb" id="stLayers"></div></div>
  </div>`;
  ["pProps","pAssets","pLayers"].forEach(i=>panelDrag($("#"+i)));
  const pick=()=>{ST.pg=+$("#stPages").value;ST.sel=null;render(true)};
  $("#stPages").addEventListener("change",pick);
  $("#stName").addEventListener("input",e=>{pg.name=e.target.value||"Untitled";$("#stPages").selectedOptions[0].textContent=pg.name;touch()});
  $("#stNewPg").addEventListener("click",()=>{S.canvas.pages.push(newPage("New page"));ST.pg=S.canvas.pages.length-1;ST.sel=null;touch();render(true)});
  $("#stDelPg").addEventListener("click",()=>{if(!confirm("Delete this page and everything on it?"))return;S.canvas.pages.splice(ST.pg,1);ST.pg=0;ST.sel=null;touch();render(true)});
  $("#stAddText").addEventListener("click",()=>stAdd("text"));$("#stAddBox").addEventListener("click",()=>stAdd("box"));
  const file=$("#stFile");$("#stAddImg").addEventListener("click",()=>file.click());$("#stUp").addEventListener("click",()=>file.click());
  file.addEventListener("change",()=>{stUpload([...file.files]);file.value=""});
  $("#stW").addEventListener("input",e=>{pg.w=Math.max(300,+e.target.value||1200);touch();stDraw()});$("#stH").addEventListener("input",e=>{pg.h=Math.max(200,+e.target.value||700);touch();stDraw()});
  $("#stBg").addEventListener("input",e=>{pg.bg=e.target.value;touch();stDraw()});$("#stBgX").addEventListener("click",()=>{pg.bg="";touch();stDraw()});
  $("#stZoom").addEventListener("input",e=>{ST.zoom=+e.target.value;stDraw()});
  $("#stOpen").addEventListener("click",e=>{store.set("mirage-preview",JSON.stringify(S));e.currentTarget.href="/p/?id="+encodeURIComponent(pg.id)+"&preview=1"});

  const cv=$("#stCv");
  cv.addEventListener("pointerdown",e=>{
    const hd=e.target.closest(".hnd"),el=e.target.closest(".blk");
    if(!el){stSelect(null);return}
    const b=stBlk(el.dataset.id);if(ST.sel!==b.id)stSelect(b.id);
    if(el.classList.contains("editing"))return;
    const sx=e.clientX,sy=e.clientY,o={x:b.x,y:b.y,w:b.w,h:b.h},m=hd?hd.dataset.h:"move";
    el.setPointerCapture(e.pointerId);const snap=v=>e.altKey?v:Math.round(v/8)*8;
    const mv=ev=>{
      const dx=(ev.clientX-sx)/ST.zoom,dy=(ev.clientY-sy)/ST.zoom;
      if(m==="move"){b.x=snap(o.x+dx);b.y=snap(o.y+dy)}
      else{let x=o.x,y=o.y,w=o.w,h=o.h;
        if(m.includes("e"))w=Math.max(20,snap(o.w+dx));if(m.includes("s"))h=Math.max(20,snap(o.h+dy));
        if(m.includes("w")){w=Math.max(20,snap(o.w-dx));x=o.x+o.w-w}if(m.includes("n")){h=Math.max(20,snap(o.h-dy));y=o.y+o.h-h}
        Object.assign(b,{x,y,w,h})}
      Object.assign(el.style,{left:b.x+"px",top:b.y+"px",width:b.w+"px",height:b.h+"px"});
    };
    const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);touch();stProps()};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);
  });
  cv.addEventListener("dblclick",e=>{
    const el=e.target.closest(".blk"),t=el&&el.querySelector(".bt");if(!t)return;
    const b=stBlk(el.dataset.id);el.classList.add("editing");t.contentEditable="plaintext-only";t.focus();
    getSelection().selectAllChildren(t);
    t.addEventListener("input",()=>{b.text=t.innerText;touch()});
    t.addEventListener("blur",()=>{t.contentEditable="false";el.classList.remove("editing");b.text=t.innerText.replace(/\n$/,"");stRepl(b);stProps();stLayers();touch()},{once:true});
  });
  const stage=$("#stStage");
  stage.addEventListener("dragover",e=>e.preventDefault());
  stage.addEventListener("drop",e=>{
    e.preventDefault();const r=cv.getBoundingClientRect(),x=Math.max(0,Math.round((e.clientX-r.left)/ST.zoom/8)*8),y=Math.max(0,Math.round((e.clientY-r.top)/ST.zoom/8)*8);
    const a=e.dataTransfer.getData("text/mirage-asset");
    if(a)stAdd("img",a,x,y);else if(e.dataTransfer.files.length)stUpload([...e.dataTransfer.files],x,y);
  });
  if(!window.__stKeys){window.__stKeys=1;document.addEventListener("keydown",e=>{
    if(TAB!=="studio"||!ST.sel||e.target.closest("input,textarea,select,[contenteditable=true],[contenteditable=plaintext-only]"))return;
    const b=stBlk(ST.sel);if(!b)return;const d=e.shiftKey?10:1;
    if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();stAct("del")}
    else if((e.ctrlKey||e.metaKey)&&e.key==="d"){e.preventDefault();stAct("dup")}
    else if(e.key.startsWith("Arrow")){e.preventDefault();if(e.key==="ArrowLeft")b.x-=d;if(e.key==="ArrowRight")b.x+=d;if(e.key==="ArrowUp")b.y-=d;if(e.key==="ArrowDown")b.y+=d;stRepl(b);stProps();touch()}
  })}
  stDraw();stAssets();
  if(!ST.loaded){ST.loaded=true;listUploads().then(fs=>{fs.forEach(f=>{const p="/"+f.path;ST.url[p]=ST.url[p]||f.download_url;if(!ST.assets.includes(p))ST.assets.push(p)});stAssets()}).catch(()=>{})}
};

/* ---------------- boot / login ---------------- */
function startApp(data){
  S=normalise(data);ORIG=ser(S);
  const d=store.get("mirageDraft");
  if(d&&d!==ORIG){if(confirm("You have unpublished edits from last time on this device. Restore them?")){try{S=normalise(JSON.parse(d))}catch(e){}}else store.del("mirageDraft")}
  $("#loginView").hidden=true;$("#appView").hidden=false;render();
}
$("#loginBtn").addEventListener("click",async()=>{
  const btn=$("#loginBtn"),err=$("#loginErr");err.textContent="";
  CFG.token=$("#tok").value.trim();
  if(!CFG.token){err.textContent="Enter your authorization token.";return}
  btn.disabled=true;btn.textContent="Checking…";
  try{startApp(await loadContent())}catch(e){err.textContent="Access denied."}
  btn.disabled=false;btn.textContent="Continue";
});
$("#tok").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click()});
$("#logoutBtn").addEventListener("click",()=>{if(S&&ser(S)!==ORIG&&!confirm("You have unpublished changes. Sign out anyway?"))return;store.del("mirage-preview");location.reload()});
$("#discardBtn").addEventListener("click",()=>{if(!confirm("Throw away all unpublished changes?"))return;S=normalise(JSON.parse(ORIG));store.del("mirageDraft");render();toast("Changes discarded")});
$("#publishBtn").addEventListener("click",publish);
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(!$("#publishBtn").disabled)publish()}});
store.del("mirageTok");$("#loginView").hidden=false;
</script>
</body>
</html>
