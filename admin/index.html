<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#031827">
<title>Mirage Access</title>
<link rel="icon" href="../assets/mirage-m.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#031827;--panel:rgba(3,28,49,.88);--panel2:rgba(6,40,66,.9);--line:rgba(105,229,255,.16);
  --text:#eafaff;--muted:#8daebe;--cyan:#65eaff;--blue:#0b70a6;--ok:#55e88a;--warn:#f1c76c;--bad:#ff7b7b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#061a2b,#0b2e4a 55%,#19527b) fixed;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--cyan)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 4vw;background:rgba(2,18,34,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .logo{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:800}
.bar .logo img{width:28px;height:28px}
.bar .logo small{display:block;font-size:9px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;font-weight:700;margin-top:1px}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.dirty{color:var(--warn);border-color:rgba(241,199,108,.5)}
.pill.clean{color:var(--ok);border-color:rgba(85,232,138,.4)}
.btn{border:1px solid rgba(104,231,255,.28);background:rgba(255,255,255,.04);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer;transition:.15s}
.btn:hover{background:rgba(101,234,255,.1);border-color:var(--cyan)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:#0d84c2}
.btn.danger{color:var(--bad);border-color:rgba(255,123,123,.35)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:210px 1fr;gap:26px;width:min(1200px,94vw);margin:26px auto 80px}
.tabs{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px}
.tab{text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;color:var(--muted);font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.on{color:var(--cyan);background:rgba(101,234,255,.08);border-color:var(--line)}
.tab .n{font-size:11px;opacity:.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:20px}
.card h3{margin:22px 0 10px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password],input[type=url],input[type=number],textarea,select{width:100%;background:rgba(1,14,26,.7);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(101,234,255,.12)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
select option{background:#06223a}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.check{display:flex;gap:9px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:17px;height:17px;accent-color:#0b70a6}

/* ---------- lists ---------- */
.item{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:rgba(1,14,26,.35)}
.item-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.item-head b{margin-right:auto;font-size:13px}
.ibtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.ibtn:hover{color:var(--cyan);border-color:var(--cyan)}
.ibtn.x:hover{color:var(--bad);border-color:var(--bad)}
.addbar{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

/* ---------- videos ---------- */
.vadd{display:flex;gap:10px}
.vadd textarea{min-height:46px;height:46px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.vc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(1,14,26,.5);display:flex;flex-direction:column;cursor:grab;transition:.15s}
.vc.drag{opacity:.35}
.vc.over{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(101,234,255,.25)}
.vc.broken{border-color:var(--bad)}
.vth{position:relative;aspect-ratio:16/9;background:#021220}
.vth img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vpos{position:absolute;top:7px;left:7px;background:rgba(2,18,34,.85);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800}
.vbad{position:absolute;inset:auto 7px 7px auto;background:var(--bad);color:#2a0000;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:800}
.vbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.vbody input{padding:7px 9px;font-size:12px}
.vact{display:flex;gap:6px}
.vact .ibtn{flex:1;height:28px;width:auto;font-size:12px}
.vid{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}

/* ---------- login ---------- */
.login{width:min(560px,92vw);margin:9vh auto}
.login .card{padding:34px}
.login h1{margin:0 0 6px;font-size:30px;letter-spacing:-1px}
.login h1 span{color:var(--cyan)}
.steps{margin:14px 0 20px;padding-left:20px;color:var(--muted);line-height:1.8;font-size:13px}
.steps b{color:var(--text)}
.err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#06304f;border:1px solid var(--cyan);border-radius:10px;padding:12px 18px;font-weight:700;z-index:100;transition:.25s;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad);background:#3a1010}
.sr{display:grid;gap:2px}
code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:12px}

@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .tabs{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .tab{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .bar{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginView" class="login" hidden>
  <div class="card">
    <h1>Mirage <span>Access</span></h1>
    <label class="f" style="margin-top:20px"><span>Authorization token</span><input id="tok" type="password" autocomplete="off" autofocus></label>
    <button class="btn primary" id="loginBtn" style="width:100%">Continue</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- ======================= EDITOR ======================= -->
<div id="appView" hidden>
  <div class="bar">
    <div class="logo"><img src="../assets/mirage-m.svg" alt=""><div>Mirage Access<small id="modeLabel"></small></div></div>
    <span class="pill" id="state">No changes</span>
    <a class="btn sm" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn sm" id="dlBtn">Download JSON</button>
    <label class="btn sm" style="cursor:pointer">Import JSON<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    <button class="btn sm danger" id="discardBtn" disabled>Discard</button>
    <button class="btn primary" id="publishBtn" disabled>Publish changes</button>
    <button class="btn sm" id="logoutBtn">Sign out</button>
  </div>
  <div class="shell">
    <nav class="tabs" id="tabs"></nav>
    <main id="panel"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   Mirage Editor
   Edits /content.json in the website repo through the GitHub API.
   ================================================================ */
const $=s=>document.querySelector(s);
const FILE="content.json";
let S=null;            // working copy
let ORIG="";           // JSON string of last saved/loaded state
let CFG={repo:"",branch:"main",token:"",offline:false};
let SHA=null;
let TAB="home";

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="toast",bad?5200:2600)}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>{let r="";new TextEncoder().encode(s).forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const get=(o,p)=>p.split(".").reduce((x,k)=>x==null?x:x[k],o);
function set(o,p,v){const k=p.split(".");const last=k.pop();let x=o;k.forEach(a=>{if(typeof x[a]!=="object"||x[a]==null)x[a]={};x=x[a]});x[last]=v}
const ser=o=>JSON.stringify(o,null,2)+"\n";

/* ---------------- defaults so missing keys never break the UI ---------------- */
function normalise(c){
  c=c||{};
  c.site=Object.assign({serverIp:"mc.miragesmp.org",discordUrl:"https://discord.gg/mirageevents"},c.site);
  c.site.announcement=Object.assign({enabled:false,text:"",link:"",linkLabel:""},c.site.announcement);
  c.hero=Object.assign({tag:"",titleLine1:"",titleLine2:"",text:"",buttonLabel:""},c.hero);
  c.sections=Object.assign({videosEyebrow:"",videosTitle:"",creatorsEyebrow:"",creatorsTitle:""},c.sections);
  c.videos=(c.videos||[]).map(v=>typeof v==="string"?{id:v,title:""}:{id:v.id,title:v.title||""});
  c.videoRail=Object.assign({speed:44},c.videoRail);
  c.creators=c.creators||[];
  c.status=Object.assign({homeTitle:"",pageTitle:"",pageText:"",items:[]},c.status);
  c.disclaimer=Object.assign({title:"",paragraphs:[]},c.disclaimer);
  c.eula=Object.assign({title:"",text:"",buttonLabel:"",url:""},c.eula);
  c.updates=Object.assign({title:"",text:"",items:[]},c.updates);
  c.footer=Object.assign({officialLinks:[],emails:[],copyright:""},c.footer);
  return c;
}

/* ---------------- GitHub API ---------------- */
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{headers:Object.assign({
    "Accept":"application/vnd.github+json","Authorization":"Bearer "+CFG.token,"X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})}));
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||("GitHub error "+r.status));e.status=r.status;throw e}
  return j;
}
async function loadFromGitHub(){
  const repo=await gh("/repos/"+CFG.repo);
  if(!repo.permissions||!repo.permissions.push) throw new Error("This token can read the repo but not write to it. Give it Contents: Read and write.");
  try{
    const f=await gh(`/repos/${CFG.repo}/contents/${FILE}?ref=${encodeURIComponent(CFG.branch)}&t=${Date.now()}`);
    SHA=f.sha;
    return JSON.parse(unb64(f.content));
  }catch(e){
    if(e.status!==404) throw e;
    SHA=null; // first save will create it
    const r=await fetch("../"+FILE,{cache:"no-store"});
    return r.ok?r.json():{};
  }
}
async function publish(){
  if(CFG.offline){toast("Offline mode: use Download JSON instead.",true);return}
  const btn=$("#publishBtn");btn.disabled=true;btn.textContent="Publishing…";
  try{
    const body={message:"Update site content via Mirage Editor",content:b64(ser(S)),branch:CFG.branch};
    if(SHA) body.sha=SHA;
    const res=await gh(`/repos/${CFG.repo}/contents/${FILE}`,{method:"PUT",body:JSON.stringify(body)});
    SHA=res.content.sha;ORIG=ser(S);store.del("mirageDraft");
    toast("Published ✓  The live site updates in about a minute.");
  }catch(e){
    if(e.status===409||e.status===422) toast("Someone else changed content.json. Download your JSON, sign out and back in, then re-apply.",true);
    else if(e.status===401||e.status===403) toast("GitHub refused the save. Check the token's Contents: Read and write permission.",true);
    else toast("Publish failed: "+e.message,true);
  }
  btn.textContent="Publish changes";refreshState();
}

/* ---------------- state / dirty ---------------- */
function refreshState(){
  const dirty=ser(S)!==ORIG;
  const st=$("#state");st.textContent=dirty?"Unsaved changes":"All changes published";st.className="pill "+(dirty?"dirty":"clean");
  $("#publishBtn").disabled=!dirty||CFG.offline;$("#discardBtn").disabled=!dirty;
  if(dirty) store.set("mirageDraft",ser(S));
  const nv=document.querySelector('[data-tab="videos"] .n');if(nv)nv.textContent=S.videos.length;
}
window.addEventListener("beforeunload",e=>{if(S&&ser(S)!==ORIG){e.preventDefault();e.returnValue=""}});
function touch(){refreshState()}

/* ---------------- field builders ---------------- */
function F(label,path,o={}){
  const v=get(S,path);const id="f"+Math.random().toString(36).slice(2);
  const tag=o.area?"textarea":"input";
  const type=o.type||"text";
  return `<label class="f"><span>${esc(label)}</span><${tag} ${o.area?"":`type="${type}"`} data-bind="${path}" ${o.ph?`placeholder="${esc(o.ph)}"`:""} ${o.area?`rows="${o.rows||3}"`:`value="${esc(v)}"`}>${o.area?esc(v):""}${o.area?"</textarea>":""}</label>`;
}
function bindAll(root){
  root.querySelectorAll("[data-bind]").forEach(n=>{
    const h=()=>{
      let v=n.type==="checkbox"?n.checked:n.value;
      if(n.type==="number")v=Number(v);
      set(S,n.dataset.bind,v);touch();
      if(n.dataset.after)window[n.dataset.after]&&window[n.dataset.after]();
    };
    n.addEventListener(n.type==="checkbox"||n.tagName==="SELECT"?"change":"input",h);
  });
}
/* generic list helpers: array at path, items drawn by fn(item,i) */
function listHTML(path,fn,label){
  const arr=get(S,path);
  return arr.map((it,i)=>`<div class="item" data-list="${path}" data-i="${i}">
    <div class="item-head"><b>${esc(label)} ${i+1}</b>
      <button class="ibtn" data-act="up" title="Move up">↑</button><button class="ibtn" data-act="down" title="Move down">↓</button><button class="ibtn x" data-act="del" title="Remove">✕</button></div>
    ${fn(it,i,path+"."+i)}</div>`).join("");
}
function wireLists(root){
  root.querySelectorAll(".item[data-list] [data-act]").forEach(b=>b.addEventListener("click",()=>{
    const it=b.closest(".item");const path=it.dataset.list,i=+it.dataset.i;const arr=get(S,path);
    if(b.dataset.act==="del"){if(!confirm("Remove this item?"))return;arr.splice(i,1)}
    if(b.dataset.act==="up"&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(b.dataset.act==="down"&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
    touch();render(true);
  }));
  root.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{
    get(S,b.dataset.add).push(JSON.parse(b.dataset.tpl));touch();render(true);
    const items=root.querySelectorAll(".item");const last=items[items.length-1];if(last){const inp=last.querySelector("input,textarea");inp&&inp.focus()}
  }));
}
const addBtn=(path,tpl,label)=>`<div class="addbar"><button class="btn" data-add="${path}" data-tpl='${esc(JSON.stringify(tpl))}'>＋ ${esc(label)}</button></div>`;

/* ---------------- YouTube helpers ---------------- */
function ytId(s){
  s=String(s||"").trim();
  if(/^[\w-]{11}$/.test(s))return s;
  try{
    const u=new URL(s.startsWith("http")?s:"https://"+s);
    if(u.hostname.includes("youtu.be"))return u.pathname.slice(1).split("/")[0].slice(0,11)||null;
    if(u.searchParams.get("v"))return u.searchParams.get("v").slice(0,11);
    const m=u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);
    if(m)return m[1];
  }catch(e){}
  return null;
}

/* ---------------- tabs ---------------- */
const TABS=[
  ["home","Homepage text"],["videos","Videos"],["creators","Creators"],["status","Status board"],
  ["updates","Changelog"],["legal","Disclaimer & EULA"],["footer","Footer & links"],["site","Server & banner"]
];
function drawTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===TAB?"on":""}" data-tab="${k}">${l}${k==="videos"?`<span class="n">${S.videos.length}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;render();window.scrollTo({top:0})}));
}
function render(keepScroll){
  const y=window.scrollY;
  drawTabs();
  const p=$("#panel");p.innerHTML=VIEWS[TAB]();
  bindAll(p);wireLists(p);if(AFTER[TAB])AFTER[TAB](p);
  if(keepScroll)window.scrollTo({top:y});
  refreshState();
}

const VIEWS={
home:()=>`
<div class="card"><h2>Homepage</h2><p class="hint">The big intro at the top of the home page.</p>
  <div class="grid2">${F("Small tag above title","hero.tag")}${F("Button label","hero.buttonLabel")}</div>
  <div class="grid2">${F("Title line 1 (white)","hero.titleLine1")}${F("Title line 2 (blue)","hero.titleLine2")}</div>
  ${F("Intro paragraph","hero.text",{area:1,rows:4})}
  <h3>Section headings</h3>
  <div class="grid2">${F("Videos: small label","sections.videosEyebrow")}${F("Videos: heading","sections.videosTitle")}
  ${F("Creators: small label","sections.creatorsEyebrow")}${F("Creators: heading","sections.creatorsTitle")}</div>
</div>`,

videos:()=>`
<div class="card"><h2>Video rotation</h2>
  <p class="hint">These scroll across the home page in this order. Paste one or more YouTube links (or 11-character IDs), one per line. Drag cards to reorder. The first card is the first one visitors see.</p>
  <div class="vadd"><textarea id="vnew" placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…"></textarea><button class="btn primary" id="vaddBtn">Add</button></div>
  <div class="vgrid" id="vgrid">${S.videos.map((v,i)=>vcard(v,i)).join("")}</div>
  ${S.videos.length?"":`<p class="hint" style="margin-top:16px">No videos yet. The website falls back to its built-in list if this is empty.</p>`}
  <h3>Rotation speed</h3>
  <label class="f"><span>Speed: <b id="spv">${S.videoRail.speed}</b> px/second (0 = still, default 44)</span>
  <input type="range" min="0" max="140" step="2" value="${S.videoRail.speed}" data-bind="videoRail.speed" data-after="spd" style="width:100%;accent-color:#0b70a6"></label>
</div>`,

creators:()=>`
<div class="card"><h2>Creators</h2><p class="hint">Cards in "Meet our Creators". The Minecraft username is used to load the 3D head. Leave UUID and custom image blank unless the head shows wrongly.</p>
  ${listHTML("creators",(c,i,p)=>`
    <div class="grid2">${F("Display name",p+".name")}${F("Minecraft username",p+".lookup")}</div>
    <div class="grid2">${F("NameMC link",p+".profile",{type:"url"})}${F("YouTube channel link",p+".yt",{type:"url"})}</div>
    <div class="grid2">${F("Caption under name",p+".role")}${F("Minecraft UUID (optional)",p+".uuid")}</div>
    ${F("Custom head image path (optional, e.g. assets/ykni-head.png)",p+".head")}`,"Creator")}
  ${addBtn("creators",{name:"",lookup:"",uuid:"",head:"",profile:"https://namemc.com/profile/",yt:"https://www.youtube.com/@",role:"Minecraft creator"},"Add creator")}
</div>`,

status:()=>`
<div class="card"><h2>Status board</h2><p class="hint">Shown on the home page and on the Status page. Use the colour to show if something is down.</p>
  <div class="grid2">${F("Home page heading","status.homeTitle")}${F("Status page heading","status.pageTitle")}</div>
  ${F("Status page intro","status.pageText",{area:1,rows:2})}
  <h3>Services</h3>
  ${listHTML("status.items",(s,i,p)=>`
    <div class="grid2">${F("Service name",p+".name")}${F("Text shown (e.g. Operational, Open, Maintenance)",p+".label")}</div>
    <label class="f"><span>Colour</span><select data-bind="${p}.level"><option value="ok" ${s.level==="ok"?"selected":""}>Green: all good</option><option value="warn" ${s.level==="warn"?"selected":""}>Yellow: degraded / maintenance</option><option value="bad" ${s.level==="bad"?"selected":""}>Red: outage / closed</option></select></label>`,"Service")}
  ${addBtn("status.items",{name:"",label:"Operational",level:"ok"},"Add service")}
</div>`,

updates:()=>`
<div class="card"><h2>Changelog</h2><p class="hint">Newest first. Use ↑ to move the latest announcement to the top.</p>
  <div class="grid2">${F("Page heading","updates.title")}${F("Page intro","updates.text")}</div>
  <h3>Entries</h3>

/* ---------------- tab-specific wiring ---------------- */
function vcard(v,i){
  return `<div class="vc" draggable="true" data-i="${i}">
    <div class="vth"><img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" onload="if(this.naturalWidth<=120)this.closest('.vc').classList.add('broken')" onerror="this.closest('.vc').classList.add('broken')"><span class="vpos">#${i+1}</span><span class="vbad" hidden>Not found</span></div>
    <div class="vbody"><input type="text" placeholder="Title (optional, for screen readers)" value="${esc(v.title)}" data-vt="${i}">
      <div class="vid">${esc(v.id)}</div>
      <div class="vact"><button class="ibtn" data-vm="${i}" data-d="-1" title="Earlier">←</button><button class="ibtn" data-vm="${i}" data-d="1" title="Later">→</button><a class="ibtn" style="display:grid;place-items:center;text-decoration:none" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener" title="Open on YouTube">↗</a><button class="ibtn x" data-vx="${i}" title="Remove">✕</button></div></div></div>`;
}
window.spd=()=>{$("#spv").textContent=S.videoRail.speed};
const AFTER={
videos(p){
  const add=async()=>{
    const ta=$("#vnew");const lines=ta.value.split(/[\s,]+/).filter(Boolean);
    if(!lines.length)return;
    let added=0,dup=0,bad=[];
    lines.forEach(l=>{const id=ytId(l);if(!id){bad.push(l);return}
      if(S.videos.some(v=>v.id===id)){dup++;return}
      S.videos.push({id,title:""});added++});
    touch();
    ta.value=bad.join("\n");
    render(true);
    toast(`${added} added`+(dup?`, ${dup} already in the list`:"")+(bad.length?`, ${bad.length} not recognised`:""),!!bad.length&&!added);
    // best-effort title lookup for new ones
    S.videos.filter(v=>!v.title).slice(-added||undefined).forEach(async v=>{
      try{const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+v.id));const j=await r.json();
        if(j.title&&!v.title){v.title=j.title;const inp=document.querySelector(`[data-vt="${S.videos.indexOf(v)}"]`);if(inp)inp.value=j.title;touch()}}catch(e){}
    });
  };
  $("#vaddBtn").addEventListener("click",add);
  $("#vnew").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();add()}});
  $("#vnew").addEventListener("paste",()=>setTimeout(()=>{if(/\n/.test($("#vnew").value.trim()))add()},0));
  p.querySelectorAll("[data-vt]").forEach(i=>i.addEventListener("input",()=>{S.videos[+i.dataset.vt].title=i.value;touch()}));
  p.querySelectorAll("[data-vx]").forEach(b=>b.addEventListener("click",()=>{S.videos.splice(+b.dataset.vx,1);touch();render(true)}));
  p.querySelectorAll("[data-vm]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.vm,j=i+ +b.dataset.d;if(j<0||j>=S.videos.length)return;
    [S.videos[i],S.videos[j]]=[S.videos[j],S.videos[i]];touch();render(true)}));
  p.querySelectorAll(".vc.broken .vbad").forEach(x=>x.hidden=false);
  p.querySelectorAll(".vc").forEach(c=>{
    c.addEventListener("dragstart",e=>{c.classList.add("drag");e.dataTransfer.setData("text/plain",c.dataset.i);e.dataTransfer.effectAllowed="move"});
    c.addEventListener("dragend",()=>{c.classList.remove("drag");p.querySelectorAll(".over").forEach(o=>o.classList.remove("over"))});
    c.addEventListener("dragover",e=>{e.preventDefault();c.classList.add("over")});
    c.addEventListener("dragleave",()=>c.classList.remove("over"));
    c.addEventListener("drop",e=>{e.preventDefault();const from=+e.dataTransfer.getData("text/plain"),to=+c.dataset.i;
      if(isNaN(from)||from===to)return;const [m]=S.videos.splice(from,1);S.videos.splice(to,0,m);touch();render(true)});
  });
  // flag thumbnails that fail after load (img onerror sets .broken before the badge exists)
  setTimeout(()=>p.querySelectorAll(".vc.broken .vbad").forEach(x=>x.hidden=false),600);
},
updates(p){
  const b=$("#newestUpdate");
  if(b)b.addEventListener("click",()=>{
    const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
    const us=d.replace(/^(\d+) (\w+) (\d+)$/,"$2 $1, $3");
    S.updates.items.unshift({date:us,title:"",body:""});touch();render(true);
    const f=document.querySelector(".item input");f&&f.focus();
  });
}
};

/* ---------------- boot / login ---------------- */
function startEditor(data){
  S=normalise(data);ORIG=ser(S);
  const draft=store.get("mirageDraft");
  if(draft&&draft!==ORIG){
    if(confirm("You have unsaved edits from last time on this device. Restore them?")){try{S=normalise(JSON.parse(draft))}catch(e){}}
    else store.del("mirageDraft");
  }
  $("#loginView").hidden=true;$("#appView").hidden=false;
  $("#modeLabel").textContent="";
  render();
}
$("#loginBtn").addEventListener("click",async()=>{
  const btn=$("#loginBtn"),err=$("#loginErr");err.textContent="";
  CFG={repo:"stickyfm-byte/mirage",branch:"main",token:$("#tok").value.trim(),offline:false};
  if(!CFG.token){err.textContent="Enter your authorization token.";return}
  btn.disabled=true;btn.textContent="Checking…";
  try{
    const data=await loadFromGitHub();
    startEditor(data);
  }catch(e){
    err.textContent="Access denied.";
  }
  btn.disabled=false;btn.textContent="Continue";
});
$("#tok").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click()});
$("#logoutBtn").addEventListener("click",()=>{
  if(S&&ser(S)!==ORIG&&!confirm("You have unpublished changes. Sign out anyway?"))return;
  store.del("mirageTok");location.reload();
});
$("#discardBtn").addEventListener("click",()=>{
  if(!confirm("Throw away all unpublished changes?"))return;
  S=normalise(JSON.parse(ORIG));store.del("mirageDraft");render();toast("Changes discarded");
});
$("#publishBtn").addEventListener("click",publish);
$("#dlBtn").addEventListener("click",()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ser(S)],{type:"application/json"}));a.download="content.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{S=normalise(JSON.parse(await f.text()));render();toast("Imported. Review, then publish.")}catch(x){toast("That file isn't valid JSON.",true)}
  e.target.value="";
});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(!$("#publishBtn").disabled)publish()}});

(function init(){
  store.del("mirageTok");
  $("#loginView").hidden=false;
})();
</script>
</body>
</html>
