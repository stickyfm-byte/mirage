<!doctype html><canvas id=c></canvas><script src="https://cdn.jsdelivr.net/npm/skinview3d@3.2.0/bundles/skinview3d.bundle.min.js"></script><script>
(async()=>{let c=document.querySelector('#c');c.width=500;c.height=500;let v=new skinview3d.SkinViewer({canvas:c,width:500,height:500,skin:null}); try {await v.loadSkin('assets/ykni-skin.png',{model:'auto'}); console.log('LOADED',v.playerObject.skin.modelType);} catch(e){console.error('ERR',e,e.stack)} })()
</script>
